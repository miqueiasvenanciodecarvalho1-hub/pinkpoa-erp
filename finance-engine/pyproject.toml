[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-engine"
version = "0.1.0"
description = "Ingestão, padronização e análise de dados financeiros multi-tenant (PJ/PF)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ai = ["anthropic>=1.15", "openai>=3.0", "google-genai>=1.0"]
pdf = ["pypdf>=5.0"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "pandas-stubs", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pypdf.*", "google.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português usam ×, °, ª legitimamente

[tool.ruff.lint.per-file-ignores]
"tests/samples.py" = ["E501"]  # fixtures OFX reproduzem linhas reais, sem quebra
